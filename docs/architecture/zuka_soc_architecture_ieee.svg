<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Inter', 'Roboto', 'Segoe UI', Arial, sans-serif; font-size: 26px; font-weight: bold; fill: #0a2540; }
      .layer-label { font-family: 'Inter', 'Roboto', 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: normal; fill: #0a2540; }
      .box-title { font-family: 'Inter', 'Roboto', 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: normal; fill: #0a2540; }
      .box-sub { font-family: 'Inter', 'Roboto', 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: normal; fill: #64748b; }
      .arrow-label { font-family: 'Inter', 'Roboto', 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: normal; fill: #475569; }
      .legend-text { font-family: 'Inter', 'Roboto', 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: normal; fill: #0a2540; }
    </style>
    <!-- Arrowhead Marker (Clean dark slate gray) -->
    <marker id="arrow-solid" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155" />
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155" />
    </marker>
  </defs>

  <!-- Pure White Flat Background -->
  <rect width="1600" height="1100" fill="#ffffff" />

  <!-- Title (Bold only, centered) -->
  <text x="800" y="65" class="title" text-anchor="middle">ZUKA SOC: AI-Assisted Security Operations Architecture</text>

  <!-- ========================================================================= -->
  <!-- 5 HORIZONTAL LAYERED BANDS -->
  <!-- ========================================================================= -->

  <!-- LAYER 1: Presentation Layer -->
  <rect x="60" y="110" width="1480" height="135" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2" />
  <rect x="70" y="130" width="220" height="95" rx="6" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1" />
  <text x="180" y="182" class="layer-label" text-anchor="middle">Presentation Layer</text>

  <!-- Component 1.1: Security Analyst -->
  <g transform="translate(360, 125)">
    <rect width="250" height="105" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8" />
    <text x="125" y="50" class="box-title" text-anchor="middle">Security Analyst</text>
    <text x="125" y="74" class="box-sub" text-anchor="middle">Operations Specialist</text>
  </g>

  <!-- Component 1.2: React Operations UI -->
  <g transform="translate(700, 125)">
    <rect width="250" height="105" rx="12" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.8" />
    <text x="125" y="50" class="box-title" text-anchor="middle">React Operations UI</text>
    <text x="125" y="74" class="box-sub" text-anchor="middle">Dashboard Interface</text>
  </g>

  <!-- Arrow: Analyst -> React UI ("query") -->
  <path d="M 610 177 L 690 177" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow-solid)" />
  <text x="650" y="165" class="arrow-label" text-anchor="middle">query</text>


  <!-- LAYER 2: Application Layer -->
  <rect x="60" y="275" width="1480" height="135" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2" />
  <rect x="70" y="295" width="220" height="95" rx="6" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1" />
  <text x="180" y="347" class="layer-label" text-anchor="middle">Application Layer</text>

  <!-- Component 2.1: FastAPI Gateway (below React UI) -->
  <g transform="translate(700, 290)">
    <rect width="250" height="105" rx="12" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="1.8" />
    <text x="125" y="50" class="box-title" text-anchor="middle">FastAPI Gateway</text>
    <text x="125" y="74" class="box-sub" text-anchor="middle">Authentication, Routing</text>
  </g>

  <!-- Component 2.2: Query Orchestrator -->
  <g transform="translate(1040, 290)">
    <rect width="250" height="105" rx="12" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.8" />
    <text x="125" y="50" class="box-title" text-anchor="middle">Query Orchestrator</text>
    <text x="125" y="74" class="box-sub" text-anchor="middle">Request Handling</text>
  </g>

  <!-- Arrow: React UI -> FastAPI Gateway ("request") -->
  <path d="M 825 230 L 825 280" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow-solid)" />
  <text x="870" y="260" class="arrow-label" text-anchor="middle">request</text>

  <!-- Arrow: FastAPI Gateway -> Query Orchestrator ("parse") -->
  <path d="M 950 342 L 1030 342" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow-solid)" />
  <text x="990" y="330" class="arrow-label" text-anchor="middle">parse</text>


  <!-- LAYER 3: Knowledge Layer -->
  <rect x="60" y="440" width="1480" height="135" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2" />
  <rect x="70" y="460" width="220" height="95" rx="6" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1" />
  <text x="180" y="512" class="layer-label" text-anchor="middle">Knowledge Layer</text>

  <!-- Component 3.1: Knowledge Base Documents -->
  <g transform="translate(340, 455)">
    <rect width="245" height="105" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8" />
    <text x="122" y="50" class="box-title" text-anchor="middle">Knowledge Base Documents</text>
    <text x="122" y="74" class="box-sub" text-anchor="middle">Security SOPs &amp; Manuals</text>
  </g>

  <!-- Component 3.2: Telemetry and Logs Store -->
  <g transform="translate(620, 455)">
    <rect width="245" height="105" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8" />
    <text x="122" y="50" class="box-title" text-anchor="middle">Telemetry and Logs Store</text>
    <text x="122" y="74" class="box-sub" text-anchor="middle">Network Telemetry &amp; Logs</text>
  </g>

  <!-- Component 3.3: Embedding Model -->
  <g transform="translate(900, 455)">
    <rect width="245" height="105" rx="12" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="1.8" />
    <text x="122" y="50" class="box-title" text-anchor="middle">Embedding Model</text>
    <text x="122" y="74" class="box-sub" text-anchor="middle">Text &amp; Log Vectorizer</text>
  </g>

  <!-- Component 3.4: Vector Database -->
  <g transform="translate(1180, 455)">
    <rect width="245" height="105" rx="12" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.8" />
    <text x="122" y="50" class="box-title" text-anchor="middle">Vector Database</text>
    <text x="122" y="74" class="box-sub" text-anchor="middle">RAG Retrieval</text>
  </g>

  <!-- Arrow: Query Orchestrator -> Vector Database ("search") -->
  <path d="M 1165 395 L 1165 425 L 1302 425 L 1302 445" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow-solid)" />
  <text x="1233" y="418" class="arrow-label" text-anchor="middle">search</text>

  <!-- Indexing Arrows (Dashed): Docs & Telemetry -> Embedding Model -> Vector Database -->
  <path d="M 585 530 L 620 530" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="5 4" />
  <path d="M 865 530 L 890 530" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-dashed)" />
  <text x="882" y="520" class="arrow-label" text-anchor="middle" font-size="11">raw</text>

  <path d="M 1145 530 L 1170 530" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-dashed)" />
  <text x="1162" y="520" class="arrow-label" text-anchor="middle">indexing</text>


  <!-- LAYER 4: AI Layer -->
  <rect x="60" y="605" width="1480" height="135" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2" />
  <rect x="70" y="625" width="220" height="95" rx="6" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1" />
  <text x="180" y="677" class="layer-label" text-anchor="middle">AI Layer</text>

  <!-- Component 4.1: Prompt Builder -->
  <g transform="translate(1020, 620)">
    <rect width="280" height="105" rx="12" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="1.8" />
    <text x="140" y="50" class="box-title" text-anchor="middle">Prompt Builder</text>
    <text x="140" y="74" class="box-sub" text-anchor="middle">Question + Retrieved Context</text>
  </g>

  <!-- Component 4.2: Local Ollama LLM -->
  <g transform="translate(620, 620)">
    <rect width="280" height="105" rx="12" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.8" />
    <text x="140" y="50" class="box-title" text-anchor="middle">Local Ollama LLM</text>
    <text x="140" y="74" class="box-sub" text-anchor="middle">qwen2.5:3b (On-Premise)</text>
  </g>

  <!-- Arrow: Vector Database -> Prompt Builder ("context") -->
  <path d="M 1302 560 L 1302 590 L 1160 590 L 1160 610" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow-solid)" />
  <text x="1231" y="583" class="arrow-label" text-anchor="middle">context</text>

  <!-- Arrow: Prompt Builder -> Local Ollama LLM ("prompt") -->
  <path d="M 1020 672 L 910 672" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow-solid)" />
  <text x="965" y="660" class="arrow-label" text-anchor="middle">prompt</text>


  <!-- LAYER 5: Output Layer -->
  <rect x="60" y="770" width="1480" height="135" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2" />
  <rect x="70" y="790" width="220" height="95" rx="6" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1" />
  <text x="180" y="842" class="layer-label" text-anchor="middle">Output Layer</text>

  <!-- Component 5.1: Triage and Actions -->
  <g transform="translate(600, 785)">
    <rect width="320" height="105" rx="12" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="1.8" />
    <text x="160" y="50" class="box-title" text-anchor="middle">Triage and Actions</text>
    <text x="160" y="74" class="box-sub" text-anchor="middle">Severity, Explanation, Next Steps</text>
  </g>

  <!-- Component 5.2: Feedback Store -->
  <g transform="translate(1020, 785)">
    <rect width="280" height="105" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8" />
    <text x="140" y="50" class="box-title" text-anchor="middle">Feedback Store</text>
    <text x="140" y="74" class="box-sub" text-anchor="middle">Continuous Learning Ledger</text>
  </g>

  <!-- Arrow: Ollama LLM -> Triage and Actions ("response") -->
  <path d="M 760 725 L 760 775" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow-solid)" />
  <text x="805" y="755" class="arrow-label" text-anchor="middle">response</text>

  <!-- Arrow: Triage and Actions -> Feedback Store (record) -->
  <path d="M 920 837 L 1010 837" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-dashed)" />
  <text x="965" y="825" class="arrow-label" text-anchor="middle">record</text>

  <!-- Arrow: Triage and Actions -> back to Analyst (Clean Left Margin Loop) -->
  <path d="M 600 837 L 200 837 L 200 177 L 350 177" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow-solid)" />
  <text x="275" y="165" class="arrow-label" text-anchor="middle">response</text>
  <text x="175" y="507" class="arrow-label" text-anchor="middle" transform="rotate(-90 175 507)">incident notification &amp; triage return loop</text>

  <!-- Arrow: Feedback Store -> Knowledge Layer ("learning loop", smooth right margin loop) -->
  <path d="M 1300 837 L 1480 837 L 1480 507 L 1435 507" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-dashed)" />
  <text x="1510" y="672" class="arrow-label" text-anchor="middle" transform="rotate(90 1510 672)">learning loop</text>


  <!-- ========================================================================= -->
  <!-- LEGEND AT BOTTOM -->
  <!-- ========================================================================= -->
  <g transform="translate(400, 960)">
    <rect width="800" height="60" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />

    <!-- Solid Arrow = Main Data Flow -->
    <path d="M 60 30 L 140 30" stroke="#334155" stroke-width="2" marker-end="url(#arrow-solid)" />
    <text x="165" y="35" class="legend-text">Main Data Flow</text>

    <!-- Dashed Arrow = Indexing and Feedback -->
    <path d="M 460 30 L 540 30" stroke="#334155" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-dashed)" />
    <text x="565" y="35" class="legend-text">Indexing and Feedback Loop</text>
  </g>

</svg>
