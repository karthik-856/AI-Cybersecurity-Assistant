<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="1120" viewBox="0 0 2100 1120" role="img" aria-labelledby="title desc">
  <title id="title">ZUKA SOC architecture: explainable detection and grounded analyst assistance</title>
  <desc id="desc">Two project workflows feed the SOC analyst workspace. The threat-detection path processes flow records through feature preparation, XGBoost, SHAP, and alert triage. The RAG assistant embeds analyst questions, retrieves relevant knowledge chunks from a ChromaDB index, and generates a grounded answer with local Ollama. The index is built from knowledge-base documents.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="9" refX="9.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9.5,4.5 L0,9 z" fill="#243746"/>
    </marker>
    <style>
      .title { font: 600 35px Arial, Helvetica, sans-serif; fill: #14283a; }
      .subtitle { font: 400 18px Arial, Helvetica, sans-serif; fill: #536779; }
      .section { font: 700 17px Arial, Helvetica, sans-serif; letter-spacing: 1.2px; fill: #315c7d; }
      .section2 { font: 700 16px Arial, Helvetica, sans-serif; letter-spacing: 1px; fill: #4c6f87; }
      .label { font: 600 19px Arial, Helvetica, sans-serif; fill: #19344c; }
      .detail { font: 400 14px Arial, Helvetica, sans-serif; fill: #536779; }
      .outputLabel { font: 700 20px Arial, Helvetica, sans-serif; fill: #17324b; }
      .outputDetail { font: 400 15px Arial, Helvetica, sans-serif; fill: #435c70; }
      .note { font: 400 14px Arial, Helvetica, sans-serif; fill: #536779; }
      .panel { fill: #f8fbfd; stroke: #d7e2ea; stroke-width: 1.5; }
      .box { fill: #ffffff; stroke: #6f8da5; stroke-width: 1.8; }
      .model { fill: #edf4f9; stroke: #527995; stroke-width: 2; }
      .store { fill: #f2f7fa; stroke: #7b95a8; stroke-width: 1.8; }
      .output { fill: #e8f1f7; stroke: #416d8c; stroke-width: 2.2; }
      .arrow { fill: none; stroke: #243746; stroke-width: 2; marker-end: url(#arrow); }
      .indexArrow { fill: none; stroke: #527995; stroke-width: 1.8; marker-end: url(#arrow); }
      .divider { stroke: #d6e1e9; stroke-width: 1.4; }
    </style>
  </defs>

  <rect width="2100" height="1120" fill="#ffffff"/>
  <text x="1050" y="66" text-anchor="middle" class="title">ZUKA SOC: Explainable Threat Detection and Analyst Assistance</text>
  <text x="1050" y="101" text-anchor="middle" class="subtitle">Two implemented workflows converge in one analyst-facing workspace</text>

  <!-- Detection and triage workflow -->
  <rect x="45" y="142" width="1600" height="300" rx="10" class="panel"/>
  <text x="75" y="181" class="section">A  /  THREAT DETECTION &amp; TRIAGE</text>
  <text x="75" y="224" class="detail">Processed flow records</text>

  <rect x="65" y="245" width="230" height="145" rx="7" class="box"/>
  <rect x="365" y="245" width="230" height="145" rx="7" class="box"/>
  <rect x="665" y="245" width="230" height="145" rx="7" class="model"/>
  <rect x="965" y="245" width="230" height="145" rx="7" class="box"/>
  <rect x="1265" y="245" width="230" height="145" rx="7" class="box"/>

  <path d="M295 317 H354" class="arrow"/>
  <path d="M595 317 H654" class="arrow"/>
  <path d="M895 317 H954" class="arrow"/>
  <path d="M1195 317 H1254" class="arrow"/>
  <path d="M1495 317 H1605 V420 H1685" class="arrow"/>

  <text x="180" y="292" text-anchor="middle" class="label"><tspan x="180">Network-flow</tspan><tspan x="180" dy="25">data</tspan></text>
  <text x="180" y="354" text-anchor="middle" class="detail"><tspan x="180">Benchmark / simulated</tspan><tspan x="180" dy="19">records</tspan></text>

  <text x="480" y="292" text-anchor="middle" class="label"><tspan x="480">Feature</tspan><tspan x="480" dy="25">preparation</tspan></text>
  <text x="480" y="354" text-anchor="middle" class="detail"><tspan x="480">Model-ready flow</tspan><tspan x="480" dy="19">features</tspan></text>

  <text x="780" y="292" text-anchor="middle" class="label"><tspan x="780">XGBoost</tspan><tspan x="780" dy="25">multiclass model</tspan></text>
  <text x="780" y="354" text-anchor="middle" class="detail"><tspan x="780">Predicted class</tspan><tspan x="780" dy="19">+ confidence</tspan></text>

  <text x="1080" y="292" text-anchor="middle" class="label"><tspan x="1080">SHAP</tspan><tspan x="1080" dy="25">explanation</tspan></text>
  <text x="1080" y="354" text-anchor="middle" class="detail"><tspan x="1080">Contributing flow</tspan><tspan x="1080" dy="19">features</tspan></text>

  <text x="1380" y="292" text-anchor="middle" class="label"><tspan x="1380">Alert triage</tspan><tspan x="1380" dy="25">&amp; recommendation</tspan></text>
  <text x="1380" y="354" text-anchor="middle" class="detail"><tspan x="1380">Severity • SOC priority</tspan><tspan x="1380" dy="19">• investigation guidance</tspan></text>

  <!-- Knowledge-grounded assistant workflow -->
  <rect x="45" y="470" width="1600" height="300" rx="10" class="panel"/>
  <text x="75" y="509" class="section">B  /  KNOWLEDGE-GROUNDED SOC ASSISTANT</text>

  <rect x="65" y="545" width="230" height="145" rx="7" class="box"/>
  <rect x="365" y="545" width="230" height="145" rx="7" class="box"/>
  <rect x="665" y="545" width="230" height="145" rx="7" class="store"/>
  <rect x="965" y="545" width="230" height="145" rx="7" class="box"/>
  <rect x="1265" y="545" width="230" height="145" rx="7" class="model"/>

  <path d="M295 617 H354" class="arrow"/>
  <path d="M595 617 H654" class="arrow"/>
  <path d="M895 617 H954" class="arrow"/>
  <path d="M1195 617 H1254" class="arrow"/>
  <path d="M1495 617 H1605 V535 H1685" class="arrow"/>

  <text x="180" y="592" text-anchor="middle" class="label"><tspan x="180">Analyst</tspan><tspan x="180" dy="25">question</tspan></text>
  <text x="180" y="654" text-anchor="middle" class="detail"><tspan x="180">Product / operations</tspan><tspan x="180" dy="19">knowledge query</tspan></text>

  <text x="480" y="592" text-anchor="middle" class="label"><tspan x="480">Query</tspan><tspan x="480" dy="25">embedding</tspan></text>
  <text x="480" y="654" text-anchor="middle" class="detail">nomic-embed-text</text>

  <text x="780" y="592" text-anchor="middle" class="label"><tspan x="780">Semantic</tspan><tspan x="780" dy="25">retrieval</tspan></text>
  <text x="780" y="654" text-anchor="middle" class="detail"><tspan x="780">Top 4 chunks</tspan><tspan x="780" dy="19">from ChromaDB</tspan></text>

  <text x="1080" y="592" text-anchor="middle" class="label"><tspan x="1080">Grounded prompt</tspan><tspan x="1080" dy="25">assembly</tspan></text>
  <text x="1080" y="654" text-anchor="middle" class="detail"><tspan x="1080">Retrieved context</tspan><tspan x="1080" dy="19">+ answer guardrails</tspan></text>

  <text x="1380" y="592" text-anchor="middle" class="label"><tspan x="1380">Local Ollama</tspan><tspan x="1380" dy="25">generation</tspan></text>
  <text x="1380" y="654" text-anchor="middle" class="detail"><tspan x="1380">qwen2.5:3b</tspan><tspan x="1380" dy="19">Answer + source section</tspan></text>

  <!-- Shared analyst-facing output -->
  <rect x="1695" y="380" width="320" height="205" rx="10" class="output"/>
  <text x="1855" y="430" text-anchor="middle" class="outputLabel"><tspan x="1855">SOC analyst</tspan><tspan x="1855" dy="27">workspace</tspan></text>
  <line x1="1730" y1="475" x2="1980" y2="475" class="divider"/>
  <text x="1855" y="507" text-anchor="middle" class="outputDetail"><tspan x="1855">Alert queue + explanations</tspan><tspan x="1855" dy="22">Grounded assistant answers</tspan><tspan x="1855" dy="22">Human review / action</tspan></text>

  <!-- Offline knowledge-base indexing path -->
  <text x="75" y="820" class="section2">KNOWLEDGE INDEXING  /  BUILT FROM CANONICAL PLATFORM DOCUMENTS</text>
  <rect x="65" y="850" width="230" height="120" rx="7" class="box"/>
  <rect x="365" y="850" width="230" height="120" rx="7" class="box"/>
  <rect x="665" y="850" width="230" height="120" rx="7" class="store"/>
  <path d="M295 910 H354" class="arrow"/>
  <path d="M595 910 H654" class="arrow"/>
  <path d="M780 850 V706" class="indexArrow"/>

  <text x="180" y="895" text-anchor="middle" class="label"><tspan x="180">Knowledge-base</tspan><tspan x="180" dy="24">documents</tspan></text>
  <text x="180" y="946" text-anchor="middle" class="detail">Canonical source</text>
  <text x="480" y="895" text-anchor="middle" class="label"><tspan x="480">Chunking +</tspan><tspan x="480" dy="24">embedding</tspan></text>
  <text x="480" y="946" text-anchor="middle" class="detail">nomic-embed-text</text>
  <text x="780" y="895" text-anchor="middle" class="label"><tspan x="780">Persistent</tspan><tspan x="780" dy="24">ChromaDB index</tspan></text>
  <text x="780" y="946" text-anchor="middle" class="detail">Vectors + section metadata</text>

  <line x1="65" y1="1010" x2="2015" y2="1010" class="divider"/>
  <text x="1050" y="1045" text-anchor="middle" class="note">Current detection uses processed or simulated flow records; real network capture is not connected.</text>
  <text x="1050" y="1072" text-anchor="middle" class="note">SHAP is explanatory evidence. The SOC analyst validates alerts; automated containment is disabled.</text>
</svg>
